version: '3.4'

x-shared-secret-environment:
  &shared-secret-environment
  environment:
    PORT: 8888
    HOST: 0.0.0.0
    WEBAPP_PORT: 8080
    LOKOLE_STORAGE_PROVIDER: AZURE_BLOBS
    CONNEXION_SPEC: dir:/app/opwen_email_server/swagger
    CELERY_QUEUE_NAMES: all
    TESTING_UI: "False"
    LOKOLE_LOG_LEVEL: INFO
    WEBAPP_WORKERS: 3
    SERVER_WORKERS: 4
    QUEUE_WORKERS: 5
  env_file:
    - ../secrets/azure.env
    - ../secrets/cloudflare.env
    - ../secrets/users.env
    - ../secrets/sendgrid.env
  volumes:
    - /tmp:/tmp
  restart: always

services:

  webapp:
    image: ascoderu/opwenwebapp:latest
    command: ["/app/docker/client/run-gunicorn.sh"]
    <<: *shared-secret-environment
    ports:
      - 8080:8080

  api:
    image: ascoderu/opwenserver_app:latest
    command: ["/app/docker/app/run-gunicorn.sh"]
    <<: *shared-secret-environment
    ports:
      - 8888:8888

  worker:
    image: ascoderu/opwenserver_app:latest
    command: ["/app/docker/app/run-celery.sh"]
    <<: *shared-secret-environment
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:management-alpine
    environment:
      # Use same creds from azure.env for convenience
      RABBITMQ_DEFAULT_USER: ${LOKOLE_EMAIL_SERVER_QUEUES_SAS_NAME}
      RABBITMQ_DEFAULT_PASS: ${LOKOLE_EMAIL_SERVER_QUEUES_SAS_KEY}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    # Optional: expose management UI
    # ports:
    #   - 15672:15672

volumes:
  rabbitmq_data:

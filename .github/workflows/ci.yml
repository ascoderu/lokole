name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  test-local:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - run: |
          make \
            -e BUILD_TARGET=runtime \
            -e REGISTRATION_CREDENTIALS=admin:password \
            -e LOKOLE_QUEUE_BROKER_SCHEME=amqp \
            build start integration-tests
      - run: make status
        if: ${{ failure() }}
      - run: make stop
        if: ${{ always() }}

  test-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - run: |
          make \
            -e BUILD_TARGET=builder \
            -e LOKOLE_SENDGRID_KEY= \
            -e LOKOLE_QUEUE_BROKER_SCHEME= \
            ci
      - run: bash <(curl -s https://codecov.io/bash)
        if: ${{ success() }}

  test-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - run: |
          BUILD_TARGET=builder docker compose build webapp && \
          docker compose run --rm --no-deps webapp ./docker/client/run-ci.sh
      - run: bash <(curl -s https://codecov.io/bash)
        if: ${{ success() }}
